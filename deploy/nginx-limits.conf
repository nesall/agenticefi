# Install in /etc/nginx/conf.d/agenticefi-limits.conf (http context).
# Empty keys are not rate limited. GET polling is never charged to these zones.
map $request_method $agenticefi_post_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $agenticefi_post_key zone=agenticefi_starts:1m rate=2r/m;
limit_req_zone $agenticefi_post_key zone=agenticefi_demos:1m rate=6r/m;
