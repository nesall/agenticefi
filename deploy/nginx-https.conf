# Reviewed template only; replace demo.example.com before installation.
# Requires deploy/nginx-limits.conf in http context and an issued TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name demo.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://demo.example.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.example.com;
    ssl_certificate /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "AgenticEFI controlled demo";
    auth_basic_user_file /etc/nginx/agenticefi.htpasswd;
    client_max_body_size 16k;
    client_body_timeout 15s;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host demo.example.com;
    proxy_set_header X-Forwarded-Host demo.example.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    # Basic credentials are checked by Nginx, never sent to the application.
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 180s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Only the ACME webroot is served from disk. Never configure a release root/alias.
    location ~ ^/(?:\.|data(?:/|$)|reports(?:/|$)|server(?:/|$)|src(?:/|$)|node_modules(?:/|$)|deploy(?:/|$)) { return 404; }
    location ~ ^/api/investigations/?$ {
        # Rewrite-phase return blocks starts without needing user cookies or passwords.
        # Nested polling, cancellation and downloads do NOT match this location.
        if (-f /etc/nginx/agenticefi-maintenance) { return 503; }
        limit_req zone=agenticefi_starts burst=1 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location ~ ^/api/demo/?$ {
        limit_req zone=agenticefi_demos burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location / { proxy_pass http://127.0.0.1:3000; }
}
