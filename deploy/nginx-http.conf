# Initial certificate bootstrap only. Replace demo.example.com. No application proxy here.
server {
    listen 80;
    listen [::]:80;
    server_name demo.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 404; }
}
