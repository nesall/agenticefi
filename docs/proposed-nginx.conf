# PROPOSAL ONLY. Do not install or reload Nginx until reviewed and approved.
# Place map and limit_req_zone directives inside the http context.
map $request_method $agenticefi_post_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $agenticefi_post_key zone=agenticefi_starts:1m rate=2r/m;
limit_req_zone $agenticefi_post_key zone=agenticefi_demos:1m rate=6r/m;

server {
    listen 443 ssl;
    server_name demo.example.com;
    ssl_certificate /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;

    auth_basic "AgenticEFI controlled demo";
    auth_basic_user_file /etc/nginx/agenticefi.htpasswd;
    client_max_body_size 16k;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 180s;

    location = /api/investigations {
        limit_req zone=agenticefi_starts burst=1 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location = /api/demo {
        limit_req zone=agenticefi_demos burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    # Polling /api/investigations/<id>, cancellation and telemetry use this path.
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
