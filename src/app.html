<!doctype html>
<html lang="en" data-theme="cerberus" data-mode="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			try {
				const mode = localStorage.getItem('agenticefi-mode');
				if (mode === 'light' || mode === 'dark') document.documentElement.dataset.mode = mode;
			} catch {
				// Keep the default light mode when browser storage is unavailable.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
